<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 200" width="100%" aria-hidden="true">
  <!-- post -->
  <rect x="78" y="120" width="18" height="74" fill="#8B6B4B" stroke="#2B2622" stroke-width="3"/>
  <!-- mailbox body -->
  <path d="M30 70 Q30 40 70 40 L130 40 Q140 40 140 50 L140 130 Q140 140 130 140 L40 140 Q30 140 30 130 Z"
        fill="#F38BA0" stroke="#2B2622" stroke-width="3" stroke-linejoin="round"/>
  <!-- slot -->
  <rect x="48" y="64" width="64" height="10" rx="4" fill="#2B2622"/>
  <!-- face -->
  <circle cx="60" cy="100" r="3" fill="#2B2622"/>
  <circle cx="100" cy="100" r="3" fill="#2B2622"/>
  <path d="M62 116 Q80 128 100 116" stroke="#2B2622" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <circle cx="48" cy="112" r="5" fill="#F4D27A" opacity=".7"/>
  <circle cx="112" cy="112" r="5" fill="#F4D27A" opacity=".7"/>
  <!-- flag -->
  <line x1="140" y1="80" x2="140" y2="40" stroke="#2B2622" stroke-width="3" stroke-linecap="round"/>
  <path d="M140 42 L168 50 L140 60 Z" fill="#7BA67B" stroke="#2B2622" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- envelope poking out -->
  <rect x="60" y="55" width="40" height="22" rx="2" fill="#FBF4EA" stroke="#2B2622" stroke-width="2"/>
  <path d="M62 57 L80 70 L98 57" stroke="#2B2622" stroke-width="2" fill="none"/>
  <!-- grass tuft -->
  <path d="M30 196 q 5 -10 10 0" stroke="#7BA67B" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M40 196 q 5 -8 10 0"  stroke="#7BA67B" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M140 196 q 5 -10 10 0" stroke="#7BA67B" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- floating heart -->
  <path d="M155 100 q -6 -6 0 -12 q 6 6 12 0 q 6 6 0 12 q -6 6 -12 0 z" fill="#F38BA0"/>
</svg>
