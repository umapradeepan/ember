<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="100%" aria-hidden="true">
  <!-- Funnel with leaking drops -->
  <path d="M30 30 L 110 30 L 80 75 L 80 115 L 60 115 L 60 75 Z"
        fill="#FFD9B8" stroke="#2B2622" stroke-width="3" stroke-linejoin="round"/>
  <!-- funnel face -->
  <circle cx="62" cy="50" r="2.4" fill="#2B2622"/>
  <circle cx="78" cy="50" r="2.4" fill="#2B2622"/>
  <path d="M62 60 Q70 55 78 60" stroke="#2B2622" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="54" cy="56" r="3.5" fill="#F38BA0" opacity=".55"/>
  <circle cx="86" cy="56" r="3.5" fill="#F38BA0" opacity=".55"/>
  <!-- leaking droplets (sad lil escaping leads) -->
  <g>
    <path d="M40 60 q -3 8 0 12 q 3 -4 0 -12 z" fill="#F38BA0" stroke="#2B2622" stroke-width="2"/>
    <path d="M105 65 q -3 8 0 12 q 3 -4 0 -12 z" fill="#F38BA0" stroke="#2B2622" stroke-width="2"/>
    <path d="M30 90 q -3 8 0 12 q 3 -4 0 -12 z" fill="#F4D27A" stroke="#2B2622" stroke-width="2"/>
    <path d="M115 100 q -3 8 0 12 q 3 -4 0 -12 z" fill="#F4D27A" stroke="#2B2622" stroke-width="2"/>
  </g>
  <!-- crack -->
  <path d="M65 95 L 70 100 L 67 108 L 73 113" stroke="#2B2622" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
