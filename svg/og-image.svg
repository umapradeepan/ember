<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- background -->
  <rect width="1200" height="630" fill="#FBF4EA"/>
  <!-- soft blobs -->
  <circle cx="120" cy="120" r="280" fill="#FAD9C7" opacity="0.7"/>
  <circle cx="1080" cy="540" r="320" fill="#C8D5B9" opacity="0.6"/>
  <circle cx="980" cy="80" r="80" fill="#F4D27A" opacity="0.55"/>
  <circle cx="80" cy="520" r="60" fill="#D9C2F0" opacity="0.6"/>

  <!-- logo + brand -->
  <g transform="translate(90 140)">
    <!-- logo egg + sprout -->
    <g transform="scale(2.4)">
      <ellipse cx="24" cy="28" rx="14" ry="16" fill="#F5B7A8"/>
      <path d="M24 14 C 18 8, 28 6, 24 0" stroke="#7BA67B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="20" cy="24" rx="3" ry="2" fill="#FFE5DC" opacity=".7"/>
      <circle cx="19" cy="30" r="1.4" fill="#2B2622"/>
      <circle cx="29" cy="30" r="1.4" fill="#2B2622"/>
      <path d="M21 34 Q24 36 27 34" stroke="#2B2622" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <circle cx="16" cy="34" r="1.8" fill="#F38BA0" opacity=".5"/>
      <circle cx="32" cy="34" r="1.8" fill="#F38BA0" opacity=".5"/>
    </g>
    <text x="140" y="86" font-family="Fraunces, Georgia, serif" font-weight="700" font-size="92" fill="#2B2622" letter-spacing="-2">ember</text>
  </g>

  <!-- headline -->
  <g transform="translate(90 290)">
    <text font-family="Fraunces, Georgia, serif" font-weight="600" font-size="72" fill="#2B2622" letter-spacing="-1.6">
      <tspan x="0" dy="0">The growth partner you’ve</tspan>
      <tspan x="0" dy="84">been </tspan>
      <tspan font-style="italic" fill="#F38BA0">waiting for.</tspan>
    </text>
  </g>

  <!-- tagline -->
  <text x="90" y="540" font-family="Nunito, sans-serif" font-weight="600" font-size="30" fill="#5b504a">
    Recruiting & tech for surrogacy agencies.
  </text>

  <!-- decorative cartoons in the corner -->
  <g transform="translate(960 340) rotate(8)">
    <!-- envelope with wings -->
    <path d="M-60 30 Q -90 0 -96 30 Q -90 50 -60 40 Z" fill="#FBF4EA" stroke="#2B2622" stroke-width="3"/>
    <path d="M60 30 Q 90 0 96 30 Q 90 50 60 40 Z" fill="#FBF4EA" stroke="#2B2622" stroke-width="3"/>
    <rect x="-60" y="6" width="120" height="80" rx="8" fill="#F4D27A" stroke="#2B2622" stroke-width="4"/>
    <path d="M-58 10 L0 56 L58 10" stroke="#2B2622" stroke-width="3" fill="none"/>
    <path d="M-10 60 q -8 -8 0 -16 q 8 8 16 0 q 8 8 0 16 q -8 8 -16 0 z" fill="#F38BA0" stroke="#2B2622" stroke-width="2"/>
  </g>
</svg>
