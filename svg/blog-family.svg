<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="100%" aria-hidden="true">
  <!-- Magnifying glass with a happy family inside -->
  <circle cx="60" cy="60" r="42" fill="#FBF4EA" stroke="#2B2622" stroke-width="4"/>
  <!-- mini family -->
  <g transform="translate(60 60)">
    <!-- parent 1 -->
    <circle cx="-14" cy="-2" r="8" fill="#FFD9B8"/>
    <path d="M-22 -2 Q-22 -12 -14 -12 Q-6 -12 -6 -2 Q-6 -6 -14 -6 Q-22 -6 -22 -2" fill="#2B2622"/>
    <circle cx="-16" cy="0" r="0.9" fill="#2B2622"/>
    <circle cx="-12" cy="0" r="0.9" fill="#2B2622"/>
    <path d="M-22 22 L-22 12 Q-22 4 -14 4 Q-6 4 -6 12 L-6 22 Z" fill="#C8D5B9"/>
    <!-- parent 2 -->
    <circle cx="14" cy="-2" r="8" fill="#FFCBA0"/>
    <path d="M6 -2 Q6 -12 14 -12 Q22 -12 22 -2 Q22 -8 14 -8 Q6 -8 6 -2" fill="#5b3a2a"/>
    <circle cx="12" cy="0" r="0.9" fill="#2B2622"/>
    <circle cx="16" cy="0" r="0.9" fill="#2B2622"/>
    <path d="M6 22 L6 12 Q6 4 14 4 Q22 4 22 12 L22 22 Z" fill="#F5B7A8"/>
    <!-- baby in middle -->
    <circle cx="0" cy="14" r="6" fill="#FFE3CC"/>
    <circle cx="-2" cy="14" r="0.7" fill="#2B2622"/>
    <circle cx="2"  cy="14" r="0.7" fill="#2B2622"/>
    <path d="M-2 17 Q0 18.5 2 17" stroke="#2B2622" stroke-width=".7" fill="none" stroke-linecap="round"/>
  </g>
  <!-- handle -->
  <line x1="90" y1="90" x2="125" y2="125" stroke="#2B2622" stroke-width="8" stroke-linecap="round"/>
  <line x1="90" y1="90" x2="125" y2="125" stroke="#F38BA0" stroke-width="4" stroke-linecap="round"/>
  <!-- sparkles -->
  <path d="M110 30 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z" fill="#F4D27A"/>
  <path d="M20 110 l1.5 4 l4 1.5 l-4 1.5 l-1.5 4 l-1.5 -4 l-4 -1.5 l4 -1.5 z" fill="#F38BA0"/>
</svg>
